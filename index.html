<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="RideFlow — Commercial Smart Mobility Platform featuring Google Maps Engine, Real-Road OSRM GPS Routing, Live Weather API, Geocoding Autocomplete, Voice Navigation, Driver Heatmaps, and Advanced Telemetry.">
  <title>RideFlow — Smart Mobility & Transportation Platform</title>
  
  <!-- Modern Clean Typography: SF Pro / Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Interactive Leaflet Maps with Google Maps Tiles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  <!-- Leaflet Heatmap Extension -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>

  <!-- Production Chart.js for Fleet & Revenue Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

  <!-- Canvas Confetti Celebration FX -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Apple HIG & Google Maps Stylesheet (Cache-Busted) -->
  <link rel="stylesheet" href="styles.css?v=3.8.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%23FFD200'/><text x='50' y='64' font-size='42' font-family='sans-serif' font-weight='900' text-anchor='middle' fill='%23121212'>RF</text></svg>">
</head>
<body>
  <div id="app">
    <!-- Persistent Google Map Canvas (Never destroyed during re-renders) -->
    <div id="google-map" class="map-canvas"></div>
    <div id="apple-map" class="map-canvas" style="display:none;"></div>
    <!-- Floating Apple UI Overlay -->
    <div id="app-overlay"></div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="app.js?v=3.8.0"></script>
</body>
</html>
